Name: "momask-g1-mixed-root-rvq-l4-ddp8"
Description: "Train BONES-SEED G1 mixed-root+absxyz RVQ on the L4 queue with single-node 8-GPU DDP."
ProjectName: "default"
RuntimeConfig:
  Image:
    Type: "Prebuild"
    Url: "vemlp-cn-beijing.cr.volces.com/preset-images/pytorch:2.10.0-cu12.9.1-py3.11-ubuntu22.04"
  Framework: "Custom"
  Command: |-
    set -euo pipefail
    export MOMASK_ROOT=/data/vepfs/users/zhaohui.yang/momask-codes
    export MOMASK_PYTHON="${MOMASK_ROOT}/.venv/bin/python"
    export PYTHONPATH="${MOMASK_ROOT}:${PYTHONPATH:-}"
    if [ ! -f "${MOMASK_ROOT}/volc/momask_g1_train_entrypoint.sh" ]; then
      echo "ERROR: VePFS code mount is missing: ${MOMASK_ROOT}" >&2
      find /data/vepfs/users/zhaohui.yang -maxdepth 4 -mindepth 1 2>/dev/null | sort | head -200 >&2 || true
      exit 2
    fi
    task_entry="/tmp/momask_g1_train_entrypoint_rvq_${RANDOM}_$$.sh"
    cp "${MOMASK_ROOT}/volc/momask_g1_train_entrypoint.sh" "${task_entry}"
    chmod +x "${task_entry}"
    exec bash "${task_entry}" rvq
  Envs:
    - Name: "MOMASK_ROOT"
      Value: "/data/vepfs/users/zhaohui.yang/momask-codes"
      IsPrivate: false
    - Name: "MOMASK_PYTHON"
      Value: "/data/vepfs/users/zhaohui.yang/momask-codes/.venv/bin/python"
      IsPrivate: false
    - Name: "G1_DATA_ROOT"
      Value: "/DRoboticsAILab/users/zhaohui.yang/dataset/BONES-G1-mixed-root"
      IsPrivate: false
    - Name: "CHECKPOINTS_DIR"
      Value: "/d-robotics-nas-dev/users/zhaohui.yang/train_jobs/momask-g1/momask-checkpoints"
      IsPrivate: false
    - Name: "MOMASK_LOG_ROOT"
      Value: "/d-robotics-nas-dev/users/zhaohui.yang/train_jobs/momask-g1/momask-log"
      IsPrivate: false
    - Name: "MOMASK_HOME"
      Value: "/d-robotics-nas-dev/users/zhaohui.yang/train_jobs/momask-g1/momask-home"
      IsPrivate: false
    - Name: "VQ_NAME"
      Value: "bones_g1_rvq_mixed_root_absxyz_nq6_l4_ddp8"
      IsPrivate: false
    - Name: "RVQ_BATCH_SIZE"
      Value: "1024"
      IsPrivate: false
    - Name: "RVQ_MAX_EPOCH"
      Value: "500"
      IsPrivate: false
    - Name: "RVQ_NUM_QUANTIZERS"
      Value: "6"
      IsPrivate: false
    - Name: "IS_CONTINUE"
      Value: "0"
      IsPrivate: false
    - Name: "DDP"
      Value: "1"
      IsPrivate: false
    - Name: "NPROC_PER_NODE"
      Value: "8"
      IsPrivate: false
    - Name: "CUDA_VISIBLE_DEVICES"
      Value: "0,1,2,3,4,5,6,7"
      IsPrivate: false
    - Name: "OMP_NUM_THREADS"
      Value: "4"
      IsPrivate: false
    - Name: "MKL_NUM_THREADS"
      Value: "4"
      IsPrivate: false
    - Name: "TOKENIZERS_PARALLELISM"
      Value: "false"
      IsPrivate: false
    - Name: "WANDB_MODE"
      Value: "offline"
      IsPrivate: false
    - Name: "PYTHONWARNINGS"
      Value: "ignore"
      IsPrivate: false
    - Name: "NO_ALBUMENTATIONS_UPDATE"
      Value: "1"
      IsPrivate: false
    - Name: "PYTORCH_CUDA_ALLOC_CONF"
      Value: "expandable_segments:True"
      IsPrivate: false
ResourceConfig:
  ResourceQueueId: "q-20260810131417-rsrdr"
  Roles:
    - Name: "worker"
      Replicas: 1
      Resource:
        Type: "Flexible"
        InstanceTypeId: ""
        FlexibleResourceClaim:
          Cpu: 40
          MemoryGiB: 360
          GpuType: "NVIDIA-L4"
          Family: "ml.gni3"
          GpuCount: 8
          RdmaEniCount: 0
        ZoneId: "cn-beijing-a"
      NodeAffinitySpec:
        StrategyType: "User"
        GPUCPUNodePreference: "GPURequired"
  Preemptible: false
  Priority: 4
  ResourceReservation: false
  OnlyUseSuspectedNode: false
  MaxRuntimeSeconds: 604800
  HoldingTimeSeconds: 0
StorageConfig:
  Storages:
    - Type: "Vepfs"
      MountPath: "/data/vepfs/users/zhaohui.yang"
      Config:
        Vepfs:
          Id: "vepfs-cnbjf7015ef11e9c"
          SubPath: "zhaohui.yang"
          FileSystemName: "DRoboticsAILab"
          HostPath: "/mnt/vepfs-cnbjf7015ef11e9c"
      ReadOnly: false
    - Type: "Efs"
      MountPath: "/DRoboticsAILab"
      Config:
        Efs:
          Id: "efs-cnbjc8a589e0f6d6f"
          Addr: "cnbjc8a589e0f6d6f.3psq7ep69ltkw6csxyuomq6f5.efs.ivolces.com:/"
          FileSystemName: "DRoboticsAILab"
      ReadOnly: true
    - Type: "Nas"
      MountPath: "/d-robotics-nas-dev"
      Config:
        Nas:
          Id: "cnas-cnbjb0b819d8ed6e69"
          Addr: "cnbjb0b819d8ed6e69.3psq7ep69ltkw6csxyuomq6f5.nas.ivolces.com:/"
          FileSystemName: "d-robotics-nas-dev"
          SubPath: ""
      ReadOnly: false
ObservableConfig: {}
